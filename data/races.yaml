# PLANTILLA para agregar una raza nueva (copiá el bloque, descomentalo y completalo al final del archivo).
# Todos los campos son obligatorios; el loader (game/loader.py) rechaza lo que falte o sea inválido.
#
# - id: gnome                      # minúsculas, sin espacios, único. Se guarda en Character.race (máx. 32 caracteres)
#   name: Gnomo                    # nombre que ve el jugador
#   stat_bonuses:                  # bonos fijos; claves válidas: strength, dexterity, wisdom, constitution
#     wisdom: 1                    # enteros >= 0. Usá {} si no tiene bonos fijos
#     constitution: 1
#   choose_bonus:                  # OPCIONAL: bono a elección del jugador (como el Humano). Omitir la clave si no aplica
#     count: 2                     # a cuántos stats distintos (1 a 4)
#     amount: 1                    # cuánto suma a cada uno
#   armor_proficiencies: [light]   # light, medium y/o heavy. [] si ninguna
#   traits:                        # rasgos; [] si no tiene. Por ahora son descriptivos (sin efecto en fórmulas)
#     - id: tinkerer
#       description: Texto del rasgo.
#
# IMPORTANTE: el contenido debe ser propio, sin nombres/criaturas/lore protegidos de D&D (GDD 10).

# Razas del MVP (GDD 3.2). Las competencias de raza son de ARMADURA (por peso).
# [SUPUESTO] pendiente de confirmar: las razas no otorgan competencia de armas.
- id: human
  name: Humano
  stat_bonuses: {}
  choose_bonus: # +1 a dos stats a elección; se aplica al crear el personaje
    count: 2
    amount: 1
  armor_proficiencies: [medium]
  traits: []

- id: dwarf
  name: Enano
  stat_bonuses:
    constitution: 2
  armor_proficiencies: [heavy]
  traits: []

- id: elf
  name: Elfo
  stat_bonuses:
    wisdom: 2
  armor_proficiencies: [light]
  traits: []

- id: halfling
  name: Mediano
  stat_bonuses:
    dexterity: 2
  armor_proficiencies: [light]
  traits:
    - id: lucky
      description: Una vez por misión relanza la peor tirada del resultado. (Sin efecto numérico todavía.)
