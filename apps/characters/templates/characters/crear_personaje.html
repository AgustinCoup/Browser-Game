<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Crear personaje</title>
</head>
<body>
    <h1>Crear personaje</h1>
    {% if error %}
        <p>{{ error }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}

        <label for="raza">Raza</label>
        <select name="raza" id="raza">
            {% for raza in razas %}
                <option value="{{ raza.id }}">{{raza.name}}
                    {% for stat, valor in raza.stat_bonuses.items %}
                        +{{valor}} {{ stat }}
                    {% endfor %}
                </option>
            {% endfor %}
        </select>

        <label for="clase">Clase</label>
        <select name="clase" id="clase">
            {% for clase in clases %}
                <option value="{{ clase.id }}">{{clase.name}}</option>
            {% endfor %}
        </select>

        <button type="submit">Crear personaje</button>
    </form>
</body>
</html>
